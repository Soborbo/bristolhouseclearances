name = "clearfields"
compatibility_date = "2026-02-01"

[vars]
TURNSTILE_SITE_KEY = ""

# Secrets (set via `wrangler secret put`):
# RESEND_API_KEY
# GOOGLE_MAPS_API_KEY
# TURNSTILE_SECRET_KEY
# SHEETS_WEBHOOK_URL
# ADMIN_EMAIL
# FROM_EMAIL

# Workers Logs: persists invocation logs, console output and uncaught
# exceptions, queryable in the dashboard and the Observability API/MCP.
# Retention depends on the Workers plan: 7 days on Workers Paid, 3 days on
# Workers Free.
[observability]
enabled = true
